<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RhinitisAtlas</title><link rel="stylesheet" href="style.css?v=20261021b"></head><body>
<header><div class="brand">RhinitisAtlas<small data-i18n="tagline"></small></div>
<nav><a href="index.html" data-i18n="nav_overview" class="on"></a><a href="datasets.html" data-i18n="nav_datasets" class=""></a><a href="gene.html" data-i18n="nav_gene" class=""></a><a href="scrna.html" data-i18n="nav_sc" class=""></a><a href="treatments.html" data-i18n="nav_treat" class=""></a><a href="spatial.html" data-i18n="nav_spatial" class=""></a><a href="pathways.html" data-i18n="nav_path" class=""></a><a href="analyze.html" data-i18n="nav_analyze" class=""></a><a href="methods.html" data-i18n="nav_methods" class=""></a><a href="downloads.html" data-i18n="nav_dl" class=""></a></nav><div class="lang"><button data-l="en" onclick="setLang('en')">EN</button><button data-l="zh" onclick="setLang('zh')">中文</button></div></header><main>
<h1>RhinitisAtlas</h1>
<p id="intro"></p>
<div class="cards" id="cards"></div>
<h2 id="h_panel"></h2><p class="mut" id="panel_note"></p><div id="panel"></div>
<div class="grid2"><div><h2 id="h_up"></h2><div id="cons_up"></div></div>
<div><h2 id="h_dn"></h2><div id="cons_dn"></div></div></div>
<h2 id="h_honest"></h2><div class="box"><ul id="honest" style="margin:0;padding-left:18px"></ul></div>
</main><footer><span data-i18n="foot"></span></footer>
<script src="app.js?v=20261021b"></script><script>
const L = {
 intro:{en:"RhinitisAtlas unifies every public human transcriptome dataset of allergic rhinitis (AR) we could verify in GEO: 69 series found by census, each read at sample level and curated as core, pending or excluded with reasons. Core datasets were re-analysed uniformly — per-cohort differential expression for bulk (never hard-merged across platforms), one shared marker vocabulary for single-cell, and an explicit declaration where a data layer does not exist (spatial).",
 zh:"RhinitisAtlas 汇总了我们能在 GEO 中核验的全部人类过敏性鼻炎（AR）公共转录组数据：普查得到 69 个系列，逐个在样本级阅读并策展为 core / pending / excluded（附理由）。核心集全部统一重分析——bulk 逐队列独立差异分析（从不跨平台硬合并）、单细胞共用一套标志物词表、不存在的组学层（空间）明确声明。"},
 c_universe:{en:"GEO series in census",zh:"普查系列"},c_samples:{en:"samples in census",zh:"普查样本"},
 c_core:{en:"core series",zh:"核心系列"},c_cores:{en:"core samples",zh:"核心样本"},
 c_bulk:{en:"bulk contrasts (disease)",zh:"bulk 疾病对比"},c_genes:{en:"genes in evidence matrix (≥5 contrasts)",zh:"证据矩阵基因（≥5 对比）"},
 c_cells:{en:"single cells annotated",zh:"已注释单细胞"},c_sc:{en:"single-cell datasets",zh:"单细胞数据集"},
 c_spatial:{en:"spatial datasets",zh:"空间数据集"},
 h_panel:{en:"Type-2 marker panel across 25 bulk disease contrasts",zh:"2 型标志物面板（25 个 bulk 疾病对比）"},
 panel_note:{en:"Mean logFC and significant-cohort counts (FDR<0.05) per gene, computed from the evidence matrix. 14 of 15 panel genes have positive mean logFC; IL33 is the single exception, echoing its behaviour in CRSwNP.",zh:"每基因的平均 logFC 与显著队列数（FDR<0.05），由证据矩阵计算。15 个面板基因中 14 个平均 logFC 为正；唯一例外是 IL33，与它在 CRSwNP 中的表现一致。"},
 h_up:{en:"Consensus up-regulated (≥3 cohorts, FDR<0.05, none opposite)",zh:"共识上调（≥3 队列，FDR<0.05，无反向）"},
 h_dn:{en:"Consensus down-regulated (≥3 cohorts, FDR<0.05, none opposite)",zh:"共识下调（≥3 队列，FDR<0.05，无反向）"},
 h_honest:{en:"What this resource does not claim",zh:"本资源不声称什么"},
 honest:{en:["Spatial transcriptomics of AR does not exist in GEO as of the cutoff — the Spatial page reports that negative result instead of substituting another disease's data.",
  "Single-cell disease contrasts rest on few donors (nasal tissue: one dataset, 2 vs 2 donors). They are flagged descriptive wherever an arm has <3 donors and are used for localisation and direction, not discovery claims.",
  "Two ILC datasets deposit normalized values only (no raw counts); their pseudobulk statistics use a normalized-data method and are labelled as such in every table.",
  "Five core bulk cohorts are deferred with named reasons (sample-mapping or paper-level design information missing) rather than silently dropped; they are listed on the Datasets page notes.",
  "Treatment and challenge contrasts are a separate evidence layer, never pooled with disease-vs-control contrasts."],
 zh:["截至数据截止日，GEO 中不存在 AR 空间转录组数据——空间页报告这一阴性结果，不借用其他疾病的数据填充。",
  "单细胞疾病对比的供体数很少（鼻组织仅 1 个数据集、2 比 2 供体）。任一臂供体 <3 的对比均标注为描述性，只用于定位与方向印证，不作发现性结论。",
  "两个 ILC 数据集只存了归一化值（无原始计数），其 pseudobulk 统计采用归一化口径方法并在每张表中标注。",
  "5 个 core bulk 队列因具名原因延后（样本映射或原文设计信息缺失），而非静默丢弃，清单见数据集页注释。",
  "治疗与激发对比是独立证据层，永不与疾病-对照对比合并。"]},
 th_gene:{en:"Gene",zh:"基因"},th_mean:{en:"Mean logFC",zh:"平均 logFC"},th_pres:{en:"Contrasts present",zh:"出现对比数"},th_up:{en:"Sig. up",zh:"显著上调"},th_dn:{en:"Sig. down",zh:"显著下调"},
};
function T(k){return L[k][LANG]||L[k].en}
async function render(){
 const s = await loadJSON("data/summary.json");
 document.getElementById("intro").textContent = T("intro");
 const cards=[[s.universe_series,"c_universe"],[s.universe_samples,"c_samples"],[s.core_series,"c_core"],[s.core_samples,"c_cores"],[s.bulk_contrasts_main,"c_bulk"],[s.matrix_genes_ge5,"c_genes"],[s.sc_total_cells,"c_cells"],[Object.keys(s.sc_datasets).length,"c_sc"],[0,"c_spatial"]];
 document.getElementById("cards").innerHTML = cards.map(c=>`<div class="card"><div class="n">${c[0].toLocaleString()}</div><div class="l">${T(c[1])}</div></div>`).join("");
 document.getElementById("h_panel").textContent=T("h_panel"); document.getElementById("panel_note").textContent=T("panel_note");
 document.getElementById("panel").innerHTML = "<table><tr><th>"+T("th_gene")+"</th><th>"+T("th_mean")+"</th><th>"+T("th_pres")+"</th><th>"+T("th_up")+"</th><th>"+T("th_dn")+"</th></tr>"+
  s.panel.map(r=>`<tr><td><a href="gene.html?g=${r.gene}">${r.gene}</a></td><td>${r.mean_logFC>0?"+":""}${r.mean_logFC}</td><td>${r.n_present}/25</td><td>${r.n_up}</td><td>${r.n_down}</td></tr>`).join("")+"</table>";
 document.getElementById("h_up").textContent=T("h_up")+` (${s.consensus_up_ge3})`;
 document.getElementById("h_dn").textContent=T("h_dn")+` (${s.consensus_down_ge3})`;
 document.getElementById("cons_up").innerHTML = s.consensus_up_list.map(g=>`<a class="chip" href="gene.html?g=${g}">${g}</a>`).join("");
 document.getElementById("cons_dn").innerHTML = s.consensus_down_list.map(g=>`<a class="chip dn" href="gene.html?g=${g}">${g}</a>`).join("");
 document.getElementById("h_honest").textContent=T("h_honest");
 document.getElementById("honest").innerHTML = T("honest").map(x=>`<li>${x}</li>`).join("");
}
window.onLang = render; render();
</script></body></html>
