<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RhinitisAtlas</title><link rel="stylesheet" href="style.css?v=20261021b"></head><body>
<header><div class="brand">RhinitisAtlas<small data-i18n="tagline"></small></div>
<nav><a href="index.html" data-i18n="nav_overview" class=""></a><a href="datasets.html" data-i18n="nav_datasets" class="on"></a><a href="gene.html" data-i18n="nav_gene" class=""></a><a href="scrna.html" data-i18n="nav_sc" class=""></a><a href="treatments.html" data-i18n="nav_treat" class=""></a><a href="spatial.html" data-i18n="nav_spatial" class=""></a><a href="pathways.html" data-i18n="nav_path" class=""></a><a href="analyze.html" data-i18n="nav_analyze" class=""></a><a href="methods.html" data-i18n="nav_methods" class=""></a><a href="downloads.html" data-i18n="nav_dl" class=""></a></nav><div class="lang"><button data-l="en" onclick="setLang('en')">EN</button><button data-l="zh" onclick="setLang('zh')">中文</button></div></header><main>
<h1 id="t"></h1><p class="mut" id="sub"></p>
<div style="margin:10px 0;display:flex;gap:8px;flex-wrap:wrap">
<select id="fv"><option value="">verdict: all</option><option>core</option><option>pending</option><option>excluded</option></select>
<select id="fl"><option value="">layer: all</option></select>
<input id="fq" size="28" placeholder="search accession / title / tissue">
<span class="mut" id="cnt"></span></div>
<div style="overflow-x:auto"><table id="tb"></table></div>
</main><footer><span data-i18n="foot"></span></footer>
<script src="app.js?v=20261021b"></script><script>
const L={t:{en:"Dataset census & curation",zh:"数据集普查与策展"},
 sub:{en:"All 69 GEO series from the census, each adjudicated at sample level. Core = enters uniform reanalysis. Notes record corrections found during reanalysis (Step-3 notes). PMID links go to PubMed; blank PMID = the GEO record has no linked paper (verified by elink), never hand-filled.",zh:"普查的全部 69 个 GEO 系列，均在样本级裁定。core = 进入统一重分析。注释记录重分析中发现的纠错（Step-3 注释）。PMID 链至 PubMed；PMID 空白 = 该 GEO 记录无关联文献（elink 核验），从不手填。"},
 cnt:{en:"series shown",zh:"显示系列数"}};
function T(k){return L[k][LANG]||L[k].en}
let DS=[];
async function render(){
 document.getElementById("t").textContent=T("t"); document.getElementById("sub").textContent=T("sub");
 if(!DS.length){ DS = await loadJSON("data/datasets.json");
   const layers=[...new Set(DS.map(d=>d.layer))].sort();
   document.getElementById("fl").innerHTML='<option value="">layer: all</option>'+layers.map(l=>`<option>${l}</option>`).join(""); }
 const fv=document.getElementById("fv").value, fl=document.getElementById("fl").value, q=document.getElementById("fq").value.toLowerCase();
 const rows=DS.filter(d=>(!fv||d.verdict===fv)&&(!fl||d.layer===fl)&&(!q||(d.accession+d.title+d.tissue_system).toLowerCase().includes(q)));
 document.getElementById("cnt").textContent = rows.length+" "+T("cnt");
 document.getElementById("tb").innerHTML = "<tr><th>GSE</th><th>Title</th><th>Verdict</th><th>Layer</th><th>n</th><th>Tissue</th><th>PMID</th><th>Notes</th></tr>"+
  rows.map(d=>`<tr><td><a href="https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=${d.accession}" target="_blank">${d.accession}</a>${d.same_trial?'<br><span class="chip">same trial: '+d.same_trial+'</span>':""}</td><td>${d.title}</td><td>${d.verdict}</td><td>${d.layer}</td><td>${d.n_samples}</td><td>${d.tissue_system||""}</td><td>${d.pmid?`<a href="https://pubmed.ncbi.nlm.nih.gov/${d.pmid}/" target="_blank">${d.pmid}</a>`:""}</td><td class="mut">${d.step3_note||""}</td></tr>`).join("");
}
["fv","fl","fq"].forEach(id=>document.getElementById(id).addEventListener("input",render));
window.onLang=render; render();
</script></body></html>
