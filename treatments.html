<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RhinitisAtlas</title><link rel="stylesheet" href="style.css?v=20261021b"></head><body>
<header><div class="brand">RhinitisAtlas<small data-i18n="tagline"></small></div>
<nav><a href="index.html" data-i18n="nav_overview" class=""></a><a href="datasets.html" data-i18n="nav_datasets" class=""></a><a href="gene.html" data-i18n="nav_gene" class=""></a><a href="scrna.html" data-i18n="nav_sc" class=""></a><a href="treatments.html" data-i18n="nav_treat" class="on"></a><a href="spatial.html" data-i18n="nav_spatial" class=""></a><a href="pathways.html" data-i18n="nav_path" class=""></a><a href="analyze.html" data-i18n="nav_analyze" class=""></a><a href="methods.html" data-i18n="nav_methods" class=""></a><a href="downloads.html" data-i18n="nav_dl" class=""></a></nav><div class="lang"><button data-l="en" onclick="setLang('en')">EN</button><button data-l="zh" onclick="setLang('zh')">中文</button></div></header><main>
<h1 id="t"></h1><p id="intro"></p>
<h2 id="h_coh"></h2><div style="overflow-x:auto"><table id="coh"></table></div>
<h2 id="h_top"></h2><div id="tops"></div>
</main><footer><span data-i18n="foot"></span></footer>
<script src="app.js?v=20261021b"></script><script>
const L={t:{en:"Treatment & challenge evidence layer",zh:"治疗与激发证据层"},
 intro:{en:"Disease-vs-control is only one layer. Allergen-challenge time series and allergen-immunotherapy (AIT) cohorts answer a different question — does the AR program move when the system is provoked or treated? Those contrasts are computed and stored separately, never pooled with disease contrasts. Top genes below are the strongest per contrast by P value (probe-level IDs as deposited for array cohorts).",zh:"疾病-对照只是一个层。过敏原激发时间序列与过敏原免疫治疗（AIT）队列回答的是另一个问题——系统被激发或治疗时，AR 程序是否移动？这些对比单独计算、单独存放，永不与疾病对比合并。下表为每对比按 P 值最强的基因（芯片队列为存入时的探针级 ID）。"},
 h_coh:{en:"Core cohorts carrying treatment / challenge designs",zh:"带治疗/激发设计的核心队列"},
 h_top:{en:"Strongest movers per secondary contrast",zh:"每个次级对比的最强变化基因"},
 up:{en:"top up",zh:"上调前列"}, dn:{en:"top down",zh:"下调前列"}};
function T(k){return L[k][LANG]||L[k].en}
const COHORTS=["GSE206149","GSE206151","GSE261239","GSE180697","GSE200107","GSE162933","GSE163367","GSE118243","GSE1964","GSE43497","GSE49782","GSE275114","GSE322669","GSE67200","GSE240503"];
async function render(){
 document.getElementById("t").textContent=T("t"); document.getElementById("intro").textContent=T("intro");
 document.getElementById("h_coh").textContent=T("h_coh"); document.getElementById("h_top").textContent=T("h_top");
 const DS = await loadJSON("data/datasets.json"); const m={}; DS.forEach(d=>m[d.accession]=d);
 document.getElementById("coh").innerHTML = "<tr><th>GSE</th><th>Title</th><th>Layer</th><th>n</th><th>Verdict</th></tr>"+
  COHORTS.filter(g=>m[g]).map(g=>{const d=m[g];return `<tr><td>${g}</td><td>${d.title}</td><td>${d.layer}</td><td>${d.n_samples}</td><td>${d.verdict}</td></tr>`}).join("");
 const TR = await loadJSON("data/treatments.json");
 document.getElementById("tops").innerHTML = Object.entries(TR).map(([k,v])=>`<h3>${k}</h3>
  <p><b>${T("up")}:</b> ${v.up.map(x=>`<span class="chip">${x[0]} (${x[1]>0?"+":""}${x[1]})</span>`).join("")}<br>
  <b>${T("dn")}:</b> ${v.down.map(x=>`<span class="chip dn">${x[0]} (${x[1]})</span>`).join("")}</p>`).join("");
}
window.onLang=render; render();
</script></body></html>
