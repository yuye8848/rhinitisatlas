<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RhinitisAtlas</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">RhinitisAtlas<small data-i18n="tagline"></small></div>
<nav><a href="index.html" data-i18n="nav_overview" class=""></a><a href="datasets.html" data-i18n="nav_datasets" class=""></a><a href="gene.html" data-i18n="nav_gene" class=""></a><a href="scrna.html" data-i18n="nav_sc" class=""></a><a href="treatments.html" data-i18n="nav_treat" class=""></a><a href="spatial.html" data-i18n="nav_spatial" class="on"></a><a href="methods.html" data-i18n="nav_methods" class=""></a><a href="downloads.html" data-i18n="nav_dl" class=""></a></nav><div class="lang"><button data-l="en" onclick="setLang('en')">EN</button><button data-l="zh" onclick="setLang('zh')">中文</button></div></header><main>
<h1 id="t"></h1><div class="box"><p id="decl"></p></div>
<h2 id="h_dist"></h2><div id="dist"></div><p class="mut" id="note"></p>
</main><footer><span data-i18n="foot"></span></footer>
<script src="app.js"></script><script>
const L={t:{en:"Spatial layer — a verified negative result",zh:"空间层——经核验的阴性结果"},
 decl:{en:"As of the data cutoff (1 October 2026), GEO contains no spatial-transcriptomics series for allergic rhinitis. The census that found 69 AR series (bulk microarray, bulk RNA-seq, single-cell, ncRNA, methylation layers) found zero Visium, GeoMx, Xenium, MERFISH or Stereo-seq series. This page reports that gap rather than filling it with another disease's data: the spatial layer will be added in a versioned update as soon as the first AR spatial series is deposited.",zh:"截至数据截止日（2026 年 10 月 1 日），GEO 中不存在过敏性鼻炎的空间转录组系列。找到 69 个 AR 系列的普查（bulk 芯片、bulk RNA-seq、单细胞、ncRNA、甲基化层）中，Visium、GeoMx、Xenium、MERFISH、Stereo-seq 系列为零。本页报告这一空白，而不用其他疾病的数据填充：首个 AR 空间系列存入后，将在版本更新中优先纳入。"},
 h_dist:{en:"Layer distribution of the 69-series census",zh:"69 个系列的组学层分布"},
 note:{en:"Counts computed live from the curation table (downloads). CRSwNP spatial data (e.g. GSE235714) belongs to the CRS universe and is intentionally not reused here.",zh:"计数由策展表实时计算（见下载区）。CRSwNP 的空间数据（如 GSE235714）属于 CRS 宇宙，本资源有意不予挪用。"}};
function T(k){return L[k][LANG]||L[k].en}
async function render(){
 document.getElementById("t").textContent=T("t"); document.getElementById("decl").textContent=T("decl");
 document.getElementById("h_dist").textContent=T("h_dist"); document.getElementById("note").textContent=T("note");
 const DS = await loadJSON("data/datasets.json"); const c={};
 DS.forEach(d=>{ c[d.layer]=c[d.layer]||{n:0,s:0}; c[d.layer].n++; c[d.layer].s+=+d.n_samples; });
 document.getElementById("dist").innerHTML = "<table><tr><th>Layer</th><th>Series</th><th>Samples</th></tr>"+
  Object.entries(c).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td>${v.s}</td></tr>`).join("")+
  `<tr><td><b>spatial (any platform)</b></td><td><b>0</b></td><td><b>0</b></td></tr></table>`;
}
window.onLang=render; render();
</script></body></html>
