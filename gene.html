<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RhinitisAtlas</title><link rel="stylesheet" href="style.css?v=20261021b"></head><body>
<header><div class="brand">RhinitisAtlas<small data-i18n="tagline"></small></div>
<nav><a href="index.html" data-i18n="nav_overview" class=""></a><a href="datasets.html" data-i18n="nav_datasets" class=""></a><a href="gene.html" data-i18n="nav_gene" class="on"></a><a href="scrna.html" data-i18n="nav_sc" class=""></a><a href="treatments.html" data-i18n="nav_treat" class=""></a><a href="spatial.html" data-i18n="nav_spatial" class=""></a><a href="pathways.html" data-i18n="nav_path" class=""></a><a href="analyze.html" data-i18n="nav_analyze" class=""></a><a href="methods.html" data-i18n="nav_methods" class=""></a><a href="downloads.html" data-i18n="nav_dl" class=""></a></nav><div class="lang"><button data-l="en" onclick="setLang('en')">EN</button><button data-l="zh" onclick="setLang('zh')">中文</button></div></header><main>
<h1 id="t"></h1><p class="mut" id="sub"></p>
<div style="display:flex;gap:8px"><input id="q" size="22" list="genes" placeholder="e.g. CST1"><datalist id="genes"></datalist><button class="go" id="go"></button></div>
<div id="out" style="margin-top:16px"></div>
</main><footer><span data-i18n="foot"></span></footer>
<script src="app.js?v=20261021b"></script><script>
const L={t:{en:"Gene query",zh:"基因查询"},
 sub:{en:"Type a gene symbol. Bulk evidence: per-cohort logFC / FDR across the 25 disease contrasts (positive = higher in AR). Single-cell evidence: donor-level pseudobulk contrasts (descriptive flags are in the runlog download).",zh:"输入基因符号。bulk 证据：25 个疾病对比的逐队列 logFC / FDR（正值 = AR 中更高）。单细胞证据：供体级 pseudobulk 对比（描述性标记见下载区 runlog）。"},
 go:{en:"Query",zh:"查询"}, notfound:{en:"Gene not in the evidence matrix (present in fewer than 5 bulk contrasts).",zh:"该基因不在证据矩阵中（出现于少于 5 个 bulk 对比）。"},
 bulk:{en:"Bulk — disease contrasts",zh:"Bulk —— 疾病对比"}, sc:{en:"Single-cell — pseudobulk contrasts",zh:"单细胞 —— pseudobulk 对比"},
 contrast:{en:"Contrast",zh:"对比"}, present:{en:"contrasts with data",zh:"有数据的对比"}};
function T(k){return L[k][LANG]||L[k].en}
let GI=null, SI=null;
async function init(){
 document.getElementById("t").textContent=T("t"); document.getElementById("sub").textContent=T("sub"); document.getElementById("go").textContent=T("go");
 GI = await loadJSON("data/gene_index.json"); SI = await loadJSON("data/sc_index.json");
 document.getElementById("genes").innerHTML = Object.keys(GI.genes).map(g=>`<option value="${g}">`).join("");
 const g = new URLSearchParams(location.search).get("g"); if(g){ document.getElementById("q").value=g.toUpperCase(); show(); }
}
function tableBulk(g){
 const e = GI.genes[g]; if(!e) return "<p>"+T("notfound")+"</p>";
 const rows = e.map(([ci,v,f])=>{ const c=GI.contrasts_main[ci]; const w=Math.min(120,Math.abs(v)*30);
   return `<tr><td>${c}</td><td><span class="bar" style="width:${w}px;background:${v>0?"#b3541e":"#3366cc"}"></span> ${v>0?"+":""}${v}</td><td>${fdrFmt(f)}</td></tr>`; }).join("");
 return `<h2>${g} — ${T("bulk")} (${e.length} ${T("present")})</h2><table><tr><th>${T("contrast")}</th><th>logFC</th><th>FDR</th></tr>${rows}</table>`;
}
function tableSC(g){
 const e = (SI.genes||{})[g]; if(!e) return "";
 const rows = e.map(([ci,v,f])=>`<tr><td>${SI.contrasts[ci].replace(/\.csv$/,"")}</td><td>${v>0?"+":""}${v}</td><td>${fdrFmt(f)}</td></tr>`).join("");
 return `<h2>${g} — ${T("sc")} (${e.length})</h2><table><tr><th>${T("contrast")}</th><th>logFC</th><th>FDR</th></tr>${rows}</table>`;
}
function show(){ const g=document.getElementById("q").value.trim().toUpperCase(); if(!g) return;
 document.getElementById("out").innerHTML = tableBulk(g) + tableSC(g); }
document.getElementById("go").addEventListener("click", show);
document.getElementById("q").addEventListener("keydown", e=>{ if(e.key==="Enter") show(); });
window.onLang=init; init();
</script></body></html>
